name: Build ReSukiSU Kernel for RM6785

on:
  workflow_dispatch:

jobs:
  build:
    name: Compile Kernel with ReSukiSU
    runs-on: ubuntu-22.04

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc curl git zip gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi libssl-dev libfl-dev libarchive-tools

      - name: Clone Proton Clang
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Clone Kernel Source (Miku Elohim)
        run: |
          git clone --depth=1 -b backup-miku https://github.com/elohim-etz/android_kernel_realme_mt6785.git kernel

      - name: Setup AnyKernel3
        run: |
          git clone --depth=1 https://github.com/KitsuNeko2001/AnyKernel-RM6785.git AnyKernel3
          # Снимаем любые ограничения по версии Android
          sed -i 's/supported.versions=.*/supported.versions=/' AnyKernel3/anykernel.sh

      - name: Integrate Latest ReSukiSU
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo -e '#ifndef SUSFS_NO_SU_STUBS\n#define SUSFS_NO_SU_STUBS\nstatic inline bool susfs_is_current_proc_no_su(void) { return false; }\nstatic inline void susfs_set_current_proc_no_su(void) {}\nstatic inline void susfs_clear_current_proc_no_su(void) {}\nstatic inline void susfs_set_current_proc_umounted_for_zygote_next(void) {}\n#endif' >> include/linux/susfs_def.h

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Elohim"
          export KBUILD_BUILD_HOST="Miku"

          make O=out ARCH=arm64 CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1 RM6785_defconfig

          # Собираем ядро строго с приклеенным деревом устройств DTB
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            READELF=llvm-readelf \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

      - name: Package AnyKernel3 Flashable ZIP
        run: |
          # Проверяем наличие Image.gz-dtb и копируем именно его
          if [ -f kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            rm -f AnyKernel3/Image.gz*
            cp -f kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz
            echo "Successfully verified and packaged Image.gz-dtb!"
          else
            echo "CRITICAL ERROR: Image.gz-dtb was not generated!"
            exit 1
          fi

          cd AnyKernel3
          zip -r9 ../Miku-RM6785-ReSukiSU-Latest.zip * -x .git README.md

      - name: Upload Flashable Kernel
        uses: actions/upload-artifact@v4
        with:
          name: Miku-RM6785-ReSukiSU-Latest
          path: Miku-RM6785-ReSukiSU-Latest.zip
          retention-days: 7
