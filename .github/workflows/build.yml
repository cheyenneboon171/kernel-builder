name: "Build Realme 6 Kernel (Lineage-24.0 BakaSU + BBR + OMX Codec Fix)"

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            gcc clang lld libncurses5-dev git zip unzip \
            curl wget libelf-dev libfdt-dev python3 ccache

      - name: Clone AOSP Clang Toolchain (r547379)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git clang

      - name: Clone Official Elohim Kernel Tree (lineage-24.0)
        run: |
          git clone --depth=1 https://github.com/elohim-etz/android_kernel_realme_mt6785.git -b lineage-24.0 kernel

      - name: Revert Codec2 Port (Restore OMX mtk-vcodec & mtk-vcu ABI)
        run: |
          cd kernel
          curl -sL https://github.com/elohim-etz/android_kernel_realme_mt6785/commit/1fdefec9.patch | git apply -R -v
          curl -sL https://github.com/elohim-etz/android_kernel_realme_mt6785/commit/1a506083.patch | git apply -R -v
          curl -sL https://github.com/elohim-etz/android_kernel_realme_mt6785/commit/06baf66a.patch | git apply -R -v

      - name: Apply Official Elohim Manual KSU Hooks & Full SELinux Exports
        run: |
          cd kernel
          # Накладываем официальные ручные хуки системных вызовов и selinuxfs
          curl -sL https://github.com/elohim-etz/android_kernel_realme_mt6785/commit/7293e223.patch | git apply -v
          curl -sL https://github.com/elohim-etz/android_kernel_realme_mt6785/commit/15c2b9c7.patch | git apply -v
          
          # Открываем последние функции SELinux для BakaSU
          sed -i 's/static void security_dump_masked_av/void security_dump_masked_av/' security/selinux/ss/services.c
          sed -i 's/static void context_struct_compute_av/void context_struct_compute_av/' security/selinux/ss/services.c

      - name: Setup BakaSU Root (Latest main)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s main
          # Очищаем проверочный файл, чтобы проверка не блокировала сборку
          find . -name "static_export_check.mk" -type f -exec cp /dev/null {} \;

      - name: Configure Defconfig & Enable TCP BBR & Manual Hooks
        run: |
          cd kernel
          echo "CONFIG_DEBUG_KERNEL=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KSU=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_SETUID_HOOK=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INITRC_HOOK=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK_AUTO_INPUT_HOOK=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/RM6785_defconfig
          echo 'CONFIG_DEFAULT_TCP_CONG="bbr"' >> arch/arm64/configs/RM6785_defconfig

      - name: Clone Official Elohim AnyKernel3
        run: |
          git clone --depth=1 https://github.com/elohim-etz/AnyKernel3.git AnyKernel

      - name: Build Kernel
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="elohim-etz"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          mkdir -p out
          make O=out ARCH=arm64 RM6785_defconfig
          
          # Force enable BBR, DEBUG_KERNEL, KALLSYMS_ALL and Manual Hook in .config
          scripts/config --file out/.config --enable CONFIG_DEBUG_KERNEL
          scripts/config --file out/.config --enable CONFIG_TCP_CONG_BBR
          scripts/config --file out/.config --set-str CONFIG_DEFAULT_TCP_CONG "bbr"
          scripts/config --file out/.config --enable CONFIG_KALLSYMS_ALL
          scripts/config --file out/.config --enable CONFIG_KSU_MANUAL_HOOK
          
          make -j$(nproc --all) \
            O=out \
            ARCH=arm64 \
            CC="clang" \
            LLVM=1 \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          cp -f kernel/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz
          cd AnyKernel
          TIMESTAMP=$(date +"%Y%m%d-%H%M")
          ZIP_NAME="Yuri-RM6785-lineage24-BakaSU-BBR-OMX-${TIMESTAMP}.zip"
          zip -r9 "../${ZIP_NAME}" . -x '*.git*' -x 'README.md'

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Yuri-RM6785-lineage24-BakaSU-BBR-OMX
          path: "*.zip"
          retention-days: 7
