name: Build Realme 6 Kernel (Miku-V2 BBR + ReSukiSU 4.2.0 + SuSFS 2.3.0)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            gcc clang lld libncurses5-dev git zip unzip \
            curl wget libelf-dev libfdt-dev python3

      - name: Clone AOSP Clang Toolchain (r547379 - Clang 20)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git clang

      - name: Clone Kernel Source (Miku-V2)
        run: |
          git clone --depth=1 https://github.com/elohim-etz/android_kernel_realme_mt6785.git -b backup-miku kernel

      - name: Setup ReSukiSU 4.2.0-rc3 (Verified Commit 94dd3c93)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s 94dd3c93
          if [ -f KernelSU/kernel/tools/static_export_check.mk ]; then
            echo "" > KernelSU/kernel/tools/static_export_check.mk
          fi

      - name: Upgrade to Full SuSFS 2.3.0 & Patch Android 17 Syscall
        run: |
          cd kernel
          # Патч для системного вызова Android 17 (SECCOMP)
          sed -i 's/u32 ret = SECCOMP_RET_ALLOW;/u32 ret = SECCOMP_RET_ALLOW;\n\tif (sd \&\& sd->nr == 142) return SECCOMP_RET_ALLOW;/' kernel/seccomp.c
          
          # Повышение версии SuSFS до 2.3.0
          sed -i 's/"v2.2.0"/"v2.3.0"/' include/linux/susfs.h

          # Полноценная логика функций SuSFS 2.3.0 через task_state
          cat << 'EOF' >> fs/susfs.c

/* Full SuSFS 2.3.0 implementation for ReSukiSU */
#define TASK_STRUCT_SUSFS_NO_SU (1ULL << 0)
#define TASK_STRUCT_SUSFS_UMOUNT_NEXT (1ULL << 1)

bool susfs_is_current_proc_no_su(void) {
	return (current->susfs_task_state & TASK_STRUCT_SUSFS_NO_SU) != 0;
}

void susfs_set_current_proc_no_su(void) {
	current->susfs_task_state |= TASK_STRUCT_SUSFS_NO_SU;
}

void susfs_clear_current_proc_no_su(void) {
	current->susfs_task_state &= ~TASK_STRUCT_SUSFS_NO_SU;
}

void susfs_set_current_proc_umounted_for_zygote_next(void) {
	current->susfs_task_state |= TASK_STRUCT_SUSFS_UMOUNT_NEXT;
}
EOF

      - name: Clone Official Elohim AnyKernel3
        run: |
          git clone --depth=1 https://github.com/elohim-etz/AnyKernel3.git AnyKernel

      - name: Build Kernel (Image.gz)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 RM6785_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 CONFIG_NO_ERROR_ON_MISMATCH=y Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          IMG=$(find kernel -name "Image.gz" | head -n 1)
          echo "Found Image.gz: $IMG"
          cp -f "$IMG" AnyKernel/Image.gz
          cd AnyKernel
          zip -r9 ../Miku-RM6785-BBR-ReSukiSU.zip * -x ".git/*" -x "README.md"

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miku-RM6785-BBR-ReSukiSU
          path: Miku-RM6785-BBR-ReSukiSU.zip
