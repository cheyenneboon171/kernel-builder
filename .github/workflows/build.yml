name: Build Realme 6 ReSukiSU (AOSP Clang 20 Stable)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            gcc clang lld libncurses5-dev git zip unzip \
            curl wget libelf-dev libfdt-dev python3

      - name: Clone AOSP Clang Toolchain (r547379 - Clang 20)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git clang

      - name: Clone Kernel Source (Stable July 3 Base)
        run: |
          git clone https://github.com/elohim-etz/android_kernel_realme_mt6785.git -b backup-miku kernel
          cd kernel
          # Откат до стабильной точки 3 июля (до багов Mali и Maple IO)
          git checkout 1f6af2a2542bf33bde0f239960cd4bcac684567b

      - name: Setup ReSukiSU & SuSFS Stubs
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo -e '#ifndef SUSFS_NO_SU_STUBS\n#define SUSFS_NO_SU_STUBS\nstatic inline bool susfs_is_current_proc_no_su(void) { return false; }\nstatic inline void susfs_set_current_proc_no_su(void) {}\nstatic inline void susfs_clear_current_proc_no_su(void) {}\nstatic inline void susfs_set_current_proc_umounted_for_zygote_next(void) {}\n#endif' >> include/linux/susfs_def.h

      - name: Clone Official Elohim AnyKernel3
        run: |
          git clone --depth=1 https://github.com/elohim-etz/AnyKernel3.git AnyKernel

      - name: Build Kernel (AOSP Clang 20)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 RM6785_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 CONFIG_NO_ERROR_ON_MISMATCH=y Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          cp -f kernel/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz
          cd AnyKernel
          zip -r9 ../Miku-RM6785-AOSP20-ReSukiSU.zip * -x .git README.md

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miku-RM6785-AOSP20-ReSukiSU
          path: Miku-RM6785-AOSP20-ReSukiSU.zip
