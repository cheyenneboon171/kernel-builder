name: Build Realme 6 Kernel (Lineage-24.0 BBR + ReSukiSU)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            gcc clang lld libncurses5-dev git zip unzip \
            curl wget libelf-dev libfdt-dev python3

      - name: Clone AOSP Clang Toolchain (r547379 - Clang 20)
        run: |
          git clone --depth=1 https://gitlab.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r547379.git clang

      - name: Clone Kernel Source (Lineage-24.0)
        run: |
          git clone --depth=1 https://github.com/elohim-etz/android_kernel_realme_mt6785.git -b lineage-24.0 kernel

      - name: Setup Official ReSukiSU Driver (Latest)
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -

      - name: Patch SECCOMP for Android 17 Syscall 142
        run: |
          cd kernel
          sed -i 's/u32 ret = SECCOMP_RET_ALLOW;/u32 ret = SECCOMP_RET_ALLOW;\n\tif (sd \&\& sd->nr == 142) return SECCOMP_RET_ALLOW;/' kernel/seccomp.c

      - name: Clean Defconfig Patch (BBR & FQ)
        run: |
          cd kernel
          # Включаем BBR и FQ Pacing без конфликта с BIC
          echo "CONFIG_TCP_CONG_BBR=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_NET_SCH_FQ=y" >> arch/arm64/configs/RM6785_defconfig
          echo "CONFIG_NET_SCH_FQ_CODEL=y" >> arch/arm64/configs/RM6785_defconfig
          sed -i 's/CONFIG_DEFAULT_BIC=y/CONFIG_DEFAULT_BBR=y/' arch/arm64/configs/RM6785_defconfig
          sed -i 's/CONFIG_DEFAULT_TCP_CONG="bic"/CONFIG_DEFAULT_TCP_CONG="bbr"/' arch/arm64/configs/RM6785_defconfig

      - name: Clone Official Elohim AnyKernel3
        run: |
          git clone --depth=1 https://github.com/elohim-etz/AnyKernel3.git AnyKernel

      - name: Build Kernel (Image.gz)
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          make O=out ARCH=arm64 RM6785_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 CONFIG_NO_ERROR_ON_MISMATCH=y Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          IMG=$(find kernel -name "Image.gz" | head -n 1)
          echo "Найден скомпилированный файл ядра: $IMG"
          cp -f "$IMG" AnyKernel/Image.gz
          cd AnyKernel
          zip -r9 ../Miku-RM6785-BBR-ReSukiSU.zip * -x ".git/*" -x "README.md"

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miku-RM6785-BBR-ReSukiSU
          path: Miku-RM6785-BBR-ReSukiSU.zip
