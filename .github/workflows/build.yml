name: Build Realme 6 ReSukiSU Kernel (September Neutron Config)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Build Environment
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev \
            gcc clang lld libncurses5-dev git zip unzip \
            curl wget libelf-dev libfdt-dev zstd

      - name: Install Neutron Clang Toolchain
        run: |
          mkdir -p "$HOME/toolchains/neutron-clang"
          cd "$HOME/toolchains/neutron-clang"
          curl -LO "https://raw.githubusercontent.com/Neutron-Toolchains/antman/main/antman"
          chmod +x antman
          ./antman -S

      - name: Clone Kernel Source
        run: |
          git clone --depth=1 https://github.com/elohim-etz/android_kernel_realme_mt6785.git -b backup-miku kernel

      - name: Setup ReSukiSU & SuSFS
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash -s main
          echo -e '#ifndef SUSFS_NO_SU_STUBS\n#define SUSFS_NO_SU_STUBS\nstatic inline bool susfs_is_current_proc_no_su(void) { return false; }\nstatic inline void susfs_set_current_proc_no_su(void) {}\nstatic inline void susfs_clear_current_proc_no_su(void) {}\nstatic inline void susfs_set_current_proc_umounted_for_zygote_next(void) {}\n#endif' >> include/linux/susfs_def.h

      - name: Clone Official Elohim AnyKernel3
        run: |
          git clone --depth=1 https://github.com/elohim-etz/AnyKernel3.git AnyKernel

      - name: Build Kernel (Neutron Clang)
        run: |
          cd kernel
          export PATH="$HOME/toolchains/neutron-clang/bin:$PATH"
          make O=out ARCH=arm64 RM6785_defconfig
          make -j$(nproc --all) O=out ARCH=arm64 CC=clang LLVM=1 CONFIG_NO_ERROR_ON_MISMATCH=y Image.gz

      - name: Package AnyKernel3 Zip
        run: |
          cp -f kernel/out/arch/arm64/boot/Image.gz AnyKernel/Image.gz
          cd AnyKernel
          zip -r9 ../Miku-RM6785-Neutron-ReSukiSU.zip * -x .git README.md

      - name: Upload Kernel Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Miku-RM6785-Neutron-ReSukiSU
          path: Miku-RM6785-Neutron-ReSukiSU.zip
